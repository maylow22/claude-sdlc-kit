name: plugin version

# An installed plugin is cached per version, so a change merged without a new version
# never reaches an existing install. This gate is the only thing that notices.
on:
  pull_request:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check diffs against the base branch

      - name: Every changed plugin carries a new version
        run: python3 .github/scripts/check_plugin_versions.py "origin/${{ github.base_ref }}"
